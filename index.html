<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marginalia</title>
<meta name="description" content="A calm personal operating system for graduate school and early adult life." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" />

<style>
  :root {
    --bg: #f7f4ed;
    --surface: #fffdf8;
    --sink: #f1ede3;
    --ink: #2a2620;
    --muted: #787063;
    --faint: #a39a8b;
    --line: #e7e0d2;
    --line-strong: #d5ccba;
    --accent: #6b5d45;
    --on-accent: #fbf8f1;
    --overdue: #a64c34;
    --done: #a89f8f;

    --c-acad: #43607f;
    --c-admin: #9c6a4c;
    --c-career: #4f7355;
    --c-people: #7c5875;
    --c-personal: #927b41;

    --font-sans: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-serif: 'IBM Plex Serif', ui-serif, Georgia, 'Times New Roman', serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17150f;
      --surface: #201d16;
      --sink: #1b1811;
      --ink: #ece5d6;
      --muted: #9a9080;
      --faint: #6f6656;
      --line: #2f2a20;
      --line-strong: #443d30;
      --accent: #c3b391;
      --on-accent: #1a1610;
      --overdue: #dd8a70;
      --done: #6d6553;

      --c-acad: #83a3c4;
      --c-admin: #cf9c7a;
      --c-career: #86ac8e;
      --c-people: #bd92b5;
      --c-personal: #ccb06c;
    }
  }

  :root[data-theme="dark"] {
    --bg: #17150f;
    --surface: #201d16;
    --sink: #1b1811;
    --ink: #ece5d6;
    --muted: #9a9080;
    --faint: #6f6656;
    --line: #2f2a20;
    --line-strong: #443d30;
    --accent: #c3b391;
    --on-accent: #1a1610;
    --overdue: #dd8a70;
    --done: #6d6553;
    --c-acad: #83a3c4;
    --c-admin: #cf9c7a;
    --c-career: #86ac8e;
    --c-people: #bd92b5;
    --c-personal: #ccb06c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .app { max-width: 1060px; margin: 0 auto; padding: 46px 26px 120px; }

  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 30px;
  }
  .wordmark { font-family: var(--font-serif); font-size: 24px; font-weight: 500; letter-spacing: 0.01em; }
  .wordmark .dot { color: var(--accent); }
  .today-date { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .shell { display: grid; grid-template-columns: 208px 1fr; gap: 54px; align-items: start; }

  /* ---------- sidebar ---------- */
  .eyebrow {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--faint);
  }

  .nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 28px; }
  .nav-gap { height: 16px; }
  .nav-label { padding: 0 10px 8px; }

  .nav-link {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 7px 10px; border: 0; background: transparent; color: var(--muted);
    font: inherit; text-align: left; cursor: pointer; border-radius: 6px;
    transition: color .14s ease, background .14s ease;
  }
  .nav-link:hover { color: var(--ink); background: var(--sink); }
  .nav-link[aria-current="page"] {
    color: var(--ink); font-weight: 500; background: var(--sink);
    box-shadow: inset 2px 0 0 var(--area, var(--accent));
  }
  .nav-link .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--area, var(--faint)); flex: none; }
  .nav-link.plain .dot { background: none; border: 1px solid var(--line-strong); }

  .add-open {
    margin-top: 18px; display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 14px; border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--surface); color: var(--ink); font: inherit; font-weight: 500; cursor: pointer;
    transition: border-color .14s ease;
  }
  .add-open:hover { border-color: var(--accent); }
  .add-open .plus { font-size: 15px; line-height: 1; color: var(--accent); }

  /* ---------- page head ---------- */
  .pane { min-width: 0; animation: fade .18s ease; }
  @keyframes fade { from { opacity: .35; } to { opacity: 1; } }

  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 18px; margin-bottom: 26px;
  }
  .crumb { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  .crumb button { border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; padding: 0; }
  .crumb button:hover { color: var(--ink); text-decoration: underline; }
  .page-title { font-family: var(--font-serif); font-size: 27px; font-weight: 500; margin: 0; text-wrap: balance; }
  .page-title .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; vertical-align: 0.06em; }
  .page-sub { color: var(--muted); font-size: 13.5px; margin-top: 3px; }

  /* ---------- sub nav ---------- */
  .subnav { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
  .subnav button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13.5px;
    padding: 8px 12px 10px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color .14s ease;
  }
  .subnav button:hover { color: var(--ink); }
  .subnav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--area, var(--accent)); font-weight: 500; }

  /* ---------- sections ---------- */
  .section { margin-bottom: 34px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .section-note { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }

  .rows { list-style: none; margin: 0; padding: 0; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 10px 4px;
    border-bottom: 1px solid var(--line); transition: background .12s ease;
  }
  .row:first-child { border-top: 1px solid var(--line); }
  .row.link { cursor: pointer; }
  .row.link:hover { background: var(--sink); }
  .row-main { flex: 1; min-width: 0; }
  .row-text { display: block; word-break: break-word; }
  .row-sub { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .row.done .row-text { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1px; }
  .row-meta { display: flex; align-items: center; gap: 10px; flex: none; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row-meta .overdue { color: var(--overdue); }
  .amount { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .check {
    width: 18px; height: 18px; border: 1.5px solid var(--line-strong); border-radius: 50%;
    display: grid; place-items: center; background: transparent; cursor: pointer; padding: 0; flex: none;
    transition: border-color .14s ease;
  }
  .check:hover { border-color: var(--muted); }
  .check svg { width: 11px; height: 11px; }
  .check path { stroke: transparent; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .row.done .check { border-color: var(--muted); }
  .row.done .check path { stroke: var(--muted); transition: stroke .18s ease; }
  .bullet { width: 18px; height: 18px; border: 1.5px solid var(--line-strong); border-radius: 50%; flex: none; }

  .del {
    border: 0; background: transparent; color: var(--faint); font-size: 17px; line-height: 1;
    padding: 2px 5px; cursor: pointer; border-radius: 5px; opacity: 0; flex: none; transition: opacity .12s ease, color .12s ease;
  }
  .row:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { color: var(--overdue); }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px;
    border: 1px solid var(--line); border-radius: 4px; font-size: 11px; font-weight: 500;
    color: var(--muted); background: transparent; cursor: pointer; white-space: nowrap;
  }
  .pill .pd { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .pill.good { color: var(--c-career); }
  .pill.work { color: var(--c-personal); }
  .pill.bad { color: var(--overdue); }
  .pill.idle { color: var(--faint); }
  .pill[disabled] { cursor: default; }

  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
  .tag .td { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .type-eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }

  .recur { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); }

  .empty { color: var(--faint); font-style: italic; padding: 16px 4px; margin: 0; font-size: 13.5px; }

  .inline-add { display: flex; align-items: center; gap: 8px; padding: 9px 4px 9px 0; border-bottom: 1px dashed var(--line); }
  .inline-add .plus { color: var(--faint); font-size: 15px; flex: none; width: 18px; text-align: center; }
  .inline-add input { flex: 1; border: 0; background: transparent; color: inherit; font: inherit; padding: 2px 0; }
  .inline-add input:focus { outline: none; }

  .link-out { font-family: var(--font-mono); font-size: 11px; color: var(--accent); text-decoration: none; }
  .link-out:hover { text-decoration: underline; }

  .milestone { display: flex; align-items: center; gap: 12px; padding: 11px 12px; margin-bottom: 6px; background: var(--sink); border-left: 2px solid var(--area, var(--accent)); border-radius: 0 5px 5px 0; }
  .milestone .m-title { flex: 1; font-weight: 500; }
  .milestone.done .m-title { color: var(--done); text-decoration: line-through; }

  /* ---------- people profile ---------- */
  .defn { display: grid; grid-template-columns: 130px 1fr; gap: 4px 16px; margin: 4px 0 8px; }
  .defn dt { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); padding-top: 9px; }
  .defn dd { margin: 0; }
  .field-input {
    width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink);
    font: inherit; padding: 6px 0; transition: border-color .14s ease;
  }
  .field-input:hover { border-bottom-color: var(--line); }
  .field-input:focus { outline: none; border-bottom-color: var(--accent); }
  textarea.field-input { resize: vertical; min-height: 44px; line-height: 1.5; }

  /* ---------- today ---------- */
  .today-area { margin-bottom: 26px; }
  .today-area-head { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .today-area-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--area); flex: none; }
  .today-area-head .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); }

  /* ---------- upcoming ---------- */
  .bucket { margin-bottom: 30px; }
  .bucket-head { font-family: var(--font-serif); font-size: 17px; font-weight: 500; margin: 0 0 8px; }
  .bucket .row-meta .cat { display: inline-flex; align-items: center; gap: 5px; }
  .bucket .row-meta .cat .cd { width: 6px; height: 6px; border-radius: 50%; }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 42%, transparent);
    display: grid; place-items: start center; padding: 8vh 20px 40px; z-index: 40; overflow-y: auto;
    animation: fade .16s ease;
  }
  .modal {
    width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 10px; padding: 24px 24px 20px; box-shadow: 0 20px 50px -24px color-mix(in srgb, var(--ink) 50%, transparent);
  }
  .modal h2 { font-family: var(--font-serif); font-size: 19px; font-weight: 500; margin: 0 0 16px; }
  .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .type-btn {
    display: flex; align-items: center; gap: 9px; padding: 13px 12px; border: 1px solid var(--line-strong);
    border-radius: 8px; background: transparent; color: var(--ink); font: inherit; cursor: pointer; text-align: left;
    transition: border-color .14s ease, background .14s ease;
  }
  .type-btn:hover { border-color: var(--accent); background: var(--sink); }
  .type-btn .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .type-btn.wide { grid-column: 1 / -1; }

  .form-row { margin-bottom: 13px; }
  .form-row label { display: block; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); margin-bottom: 5px; }
  .inp {
    width: 100%; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--bg); color: var(--ink);
    font: inherit; font-size: 14px; padding: 9px 10px;
  }
  .inp:focus { outline: none; border-color: var(--accent); }
  textarea.inp { resize: vertical; min-height: 54px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .btn-ghost { border: 0; background: transparent; color: var(--muted); font: inherit; cursor: pointer; padding: 8px 4px; }
  .btn-ghost:hover { color: var(--ink); }
  .btn-primary {
    border: 0; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600;
    padding: 9px 20px; border-radius: 7px; cursor: pointer;
  }
  .btn-primary:hover { filter: brightness(1.07); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, .pane, .overlay { animation: none !important; }
    .row.done .check path, .check, .field-input { transition: none; }
  }

  @media (max-width: 780px) {
    .class-row { flex-wrap: wrap; gap: 2px 12px; }
    .class-time { width: auto; }
    .app { padding: 30px 18px 90px; }
    .shell { grid-template-columns: 1fr; gap: 24px; }
    .nav { position: static; flex-direction: row; flex-wrap: wrap; gap: 6px; }
    .nav-label, .nav-gap, .fresh { display: none; }
    .nav-link { width: auto; }
    .add-open { margin-top: 4px; }
    .defn { grid-template-columns: 1fr; gap: 0; }
    .defn dt { padding-top: 12px; }
  }

  /* ---------- sign-in + sync ---------- */
  [hidden] { display: none !important; }
  .brand-right { display: flex; align-items: baseline; gap: 18px; }
  .sync { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }
  .sync.error { color: var(--overdue); }
  .signout { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer; padding: 0; }
  .signout:hover { color: var(--ink); text-decoration: underline; }
  .edit { border: 0; background: transparent; color: var(--faint); font: inherit; font-size: 12px; padding: 2px 7px; cursor: pointer; border-radius: 5px; opacity: .6; flex: none; transition: opacity .12s ease, color .12s ease; }
  .del { opacity: .6; }
  .row:hover .edit, .row:hover .del, .milestone:hover .edit, .milestone:hover .del, .edit:focus-visible, .del:focus-visible { opacity: 1; }
  .edit:hover { color: var(--ink); }
  .row-text.editable { cursor: pointer; }
  .row-text.editable:hover { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
  .head-actions { display: flex; gap: 14px; align-items: center; padding-bottom: 4px; }
  .head-actions .btn-ghost { font-size: 13px; padding: 4px 0; }
  .class-box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 8px; margin-bottom: 28px; }
  .class-box-head { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .class-box-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-acad); flex: none; }
  .class-box-head .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); }
  .class-day { font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin: 10px 0 2px; }
  .class-row { display: flex; align-items: baseline; gap: 14px; width: 100%; border: 0; background: transparent; font: inherit; color: var(--ink); text-align: left; padding: 5px 4px; margin: 0 -4px; cursor: pointer; border-radius: 4px; transition: background .12s ease; }
  .class-row:hover { background: var(--sink); }
  .class-time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); flex: none; width: 152px; font-variant-numeric: tabular-nums; }
  .class-name { flex: 1; min-width: 0; }
  .class-place { font-size: 12.5px; color: var(--muted); flex: none; }
  .class-times { margin-top: 12px; display: flex; flex-direction: column; gap: 3px; }
  .ct-row { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
  .ct-name { font-weight: 500; }
  .ct-when { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
  .ct-next { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }
  .ct-row:hover .edit, .ct-row:hover .del { opacity: 1; }
  .class-times .add-link { align-self: flex-start; padding-top: 4px; }
  .week { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 12px 10px; margin-bottom: 28px; overflow-x: auto; }
  .week-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; position: sticky; left: 0; }
  .week-head .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); }
  .week-head .range { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }
  .week-grid { display: grid; grid-template-columns: 42px repeat(7, minmax(62px, 1fr)); min-width: 548px; }
  .week-day-head { text-align: center; padding: 2px 0 5px; border-bottom: 2px solid transparent; font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; }
  .week-day-head b { display: block; font-family: var(--font-sans); font-weight: 600; font-size: 14px; letter-spacing: 0; color: var(--ink); }
  .week-day-head.today { border-bottom-color: var(--accent); color: var(--accent); }
  .week-axis-due { font-family: var(--font-mono); font-size: 9.5px; color: var(--faint); text-align: right; padding: 3px 6px 0 0; }
  .week-due { border-left: 1px solid var(--line); padding: 2px 3px 6px; display: flex; flex-direction: column; gap: 1px; min-height: 22px; min-width: 0; }
  .week-chip { display: flex; align-items: center; gap: 4px; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 10.5px; line-height: 1.3; color: var(--ink); padding: 1px 2px; text-align: left; border-radius: 3px; }
  button.week-chip { cursor: pointer; }
  button.week-chip:hover { background: var(--sink); }
  .week-chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--accent)); flex: none; }
  .week-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .week-more { font-family: var(--font-mono); font-size: 9.5px; color: var(--faint); padding-left: 2px; }
  .week-axis { position: relative; border-top: 1px solid var(--line); }
  .week-axis span { position: absolute; right: 6px; margin-top: 2px; font-family: var(--font-mono); font-size: 9.5px; color: var(--faint); white-space: nowrap; }
  .week-col { position: relative; min-width: 0; border-left: 1px solid var(--line); border-top: 1px solid var(--line);
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, var(--line) 27px, var(--line) 28px); }
  .week-col.today, .week-due.today { background-color: var(--sink); }
  .week-block { position: absolute; display: flex; flex-direction: column; align-items: flex-start; overflow: hidden; border: 0; border-left: 2px solid var(--c, var(--accent));
    background: color-mix(in srgb, var(--c, var(--accent)) 22%, var(--surface)); color: var(--ink); font: inherit; font-size: 10.5px; line-height: 1.25;
    padding: 2px 4px; margin-left: 1px; text-align: left; border-radius: 0 4px 4px 0; cursor: pointer; transition: filter .12s ease; }
  .week-block:hover { filter: brightness(1.12); }
  .wb-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .wb-time { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); white-space: nowrap; }
  .days { display: flex; gap: 6px; flex-wrap: wrap; }
  .day { border: 1px solid var(--line-strong); background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; padding: 6px 11px; border-radius: 6px; cursor: pointer; transition: background .12s ease, color .12s ease, border-color .12s ease; }

var ROUTE_KEY = "marginalia.route";

var sb = null;                          // Supabase client
var userId = null;

var saveTimer = null;
var inflight = false;

/* Turn a Supabase/PostgREST error into something that says what to do about it. */
var GRANT_SQL = "grant select, insert, update on public.app_state to authenticated;";
function friendly(err){ var e = new Error(friendlyError(err)); e.friendly = true; return e; }
function friendlyError(err){
  if (err && err.friendly) return err.message;
  var msg = (err && err.message) || "Unknown error";
  var code = (err && err.code) || "";
  if (code === "42703" || /column .*rev/i.test(msg))
    return "Your database needs a one-time update. In Supabase open SQL Editor and run supabase/002_add_rev.sql.";
  if (code === "42501" || /permission denied/i.test(msg))
    return "Your database is missing permission for signed-in users. In Supabase open SQL Editor, run: " + GRANT_SQL;
  if (code === "42P01" || code === "PGRST205" || /could not find the table|does not exist/i.test(msg))
    return "The app_state table doesn't exist yet. In Supabase open SQL Editor and run supabase/schema.sql.";
  if (/jwt|token|not authenticated|401/i.test(msg) || (err && err.status === 401))
    return "Your session expired. Sign out and sign back in.";
  if (/failed to fetch|network|load failed/i.test(msg))
    return "You appear to be offline. Changes will save when you reconnect.";
  return "Couldn't save: " + msg;
}

function save(){
  if (!state) return;
  try { localStorage.setItem(ROUTE_KEY, JSON.stringify(state.ui.route)); } catch (e) {}
  var s = JSON.stringify(dataOnly(state));
  if (s === lastSaved || s === queued) return;       // nothing new (navigation alone doesn't upload)
  queued = s;
  setSync("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}

/* ---- merging: combine this device's changes with changes saved elsewhere (another device, or
   Claude through the MCP server), item by item, so neither side's edits are thrown away. ---- */
function canon(v){
  if (Array.isArray(v)) return "[" + v.map(canon).join(",") + "]";
  if (v && typeof v === "object")
    return "{" + Object.keys(v).sort().map(function (k){ return JSON.stringify(k) + ":" + canon(v[k]); }).join(",") + "}";
  return JSON.stringify(v === undefined ? null : v);
}
function same(a, b){ return canon(a) === canon(b); }
function isObj(v){ return !!v && typeof v === "object" && !Array.isArray(v); }
function idList(v){
  return Array.isArray(v) && (v.length === 0 || v.every(function (x){ return isObj(x) && x.id != null; }));
}
function mergeById(B, L, R){
  var index = function (a){ var m = {}; a.forEach(function (x){ m[x.id] = x; }); return m; };
  var b = index(B), r = index(R), out = [], seen = {};
  L.forEach(function (item){
    seen[item.id] = 1;
    if (item.id in r) out.push(merge3(b[item.id], item, r[item.id]));
    else if (item.id in b){ if (!same(b[item.id], item)) out.push(item); }   // deleted elsewhere: drop it unless edited here
    else out.push(item);                                                       // added here
  });
  R.forEach(function (item){
    if (seen[item.id]) return;
    if (item.id in b){ if (!same(b[item.id], item)) out.push(item); }         // deleted here: keep only if edited elsewhere
    else out.push(item);                                                       // added elsewhere
  });
  return out;
}
/* base = what we last synced, local = this device now, remote = what's in the cloud now. */
function merge3(base, local, remote){
  if (same(local, remote)) return local;
  if (same(base, local)) return remote;        // only the cloud changed
  if (same(base, remote)) return local;        // only this device changed
  if (isObj(local) && isObj(remote)){
    var b = isObj(base) ? base : {}, keys = {}, out = {};
    [local, remote, b].forEach(function (o){ Object.keys(o).forEach(function (k){ keys[k] = 1; }); });
    Object.keys(keys).forEach(function (k){
      var m = merge3(b[k], local[k], remote[k]);
      if (m !== undefined) out[k] = m;
    });
    return out;
  }
  var L = Array.isArray(local) ? local : [], R = Array.isArray(remote) ? remote : [], B = Array.isArray(base) ? base : [];
  if ((Array.isArray(local) || Array.isArray(remote)) && idList(L) && idList(R) && idList(B)) return mergeById(B, L, R);
  return local;                                // both sides changed the same value: this device wins
}

function applyData(d){
  var ui = state.ui, dialogOpen = !!(add || edit);
  state = d;
  state.ui = ui;
  if (dialogOpen) closeAdd();                  // an open dialog points at the old data
}

function fetchRemote(){
  return sb.from("app_state").select(hasRev ? "data,rev" : "data").eq("user_id", userId).maybeSingle().then(function (res){
    if (res.error && hasRev && (res.error.code === "42703" || /column .*rev/i.test(res.error.message || ""))){
      hasRev = false;                          // the database update hasn't been run yet: carry on the old way
      return fetchRemote();
    }
    if (res.error) throw friendly(res.error);
    if (!res.data) return null;
    if (!validState(res.data.data)) throw friendly({ message: "Saved data looks unreadable, so nothing was changed." });
    return { data: res.data.data, rev: hasRev ? res.data.rev : null };
  });
}

function flush(){
  clearTimeout(saveTimer);
  if (inflight || !sb || !userId || !queued || queued === lastSaved) return Promise.resolve();
  inflight = true;
  var payload = queued, data = JSON.parse(payload);
  // Only save if the cloud is still at the version we loaded; otherwise merge first.
  var req = !hasRev
    ? sb.from("app_state").upsert({ user_id: userId, data: data, updated_at: new Date().toISOString() })
    : rev == null
      ? sb.from("app_state").insert({ user_id: userId, data: data }).select("rev")
      : sb.from("app_state").update({ data: data }).eq("user_id", userId).eq("rev", rev).select("rev");
  return req.then(function (res){
    if (res.error && res.error.code === "23505") return "conflict";     // the row was created in the meantime
    if (res.error) throw res.error;
    if (hasRev){
      if (!res.data || !res.data.length) return "conflict";             // saved elsewhere since we loaded
      rev = res.data[0].rev;
    }
    lastSaved = payload;
    try { localStorage.removeItem(LEGACY_KEY); } catch (e) {}
    return "ok";
  }).then(function (outcome){
    if (outcome === "conflict") return resolveConflict();
    inflight = false;
    if (queued === payload) queued = "";
    if (queued && queued !== lastSaved){ setSync("saving"); saveTimer = setTimeout(flush, 0); }
    else setSync("saved");
  }).catch(function (err){
    inflight = false;
    setSync("error");
    showBanner(friendlyError(err));
    saveTimer = setTimeout(flush, 5000);
  });
}

function resolveConflict(){
  return fetchRemote().then(function (remote){
    if (!remote){ rev = null; inflight = false; saveTimer = setTimeout(flush, 0); return; }   // row vanished: recreate it
    var base = lastSaved ? JSON.parse(lastSaved) : {};
    var snapshot = JSON.stringify(remote.data);
    applyData(merge3(base, dataOnly(state), remote.data));
    rev = remote.rev;
    lastSaved = snapshot;
    queued = JSON.stringify(dataOnly(state));
    inflight = false;
    if (queued === lastSaved){ queued = ""; setSync("saved"); }
    else { setSync("saving"); saveTimer = setTimeout(flush, 0); }
    render();
  });
}

/* Pick up changes made elsewhere, but never while you're typing, a dialog is open, or a save is pending. */
function busy(){
  var a = document.activeElement;
  return inflight || !!queued || !!document.querySelector(".overlay") ||
    !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest("#pane"));
}
function pull(){
  if (!sb || !userId || !state || !hasRev || busy()) return;
  sb.from("app_state").select("rev").eq("user_id", userId).maybeSingle().then(function (res){
    if (res.error || !res.data || res.data.rev === rev || busy()) return null;
    return fetchRemote().then(function (remote){
      if (!remote || busy()) return;
      var snapshot = JSON.stringify(remote.data);
      applyData(remote.data);
      rev = remote.rev;
      lastSaved = snapshot;
      render();
      setSync("saved");
    });
  }).catch(function (){ /* try again on the next tick */ });
}
function startPolling(){
  clearInterval(pullTimer);
  pullTimer = setInterval(function (){ if (document.visibilityState === "visible") pull(); }, 20000);
}
document.addEventListener("visibilitychange", function (){
  if (document.visibilityState === "hidden") flush(); else pull();
});
window.addEventListener("focus", pull);

/* Never writes unless the read succeeded, so a failed load can't overwrite saved data. */
function loadRemote(){
  return fetchRemote().then(function (remote){
    if (remote){
      lastSaved = JSON.stringify(remote.data);
      rev = remote.rev;
      return remote.data;
    }
    // First sign-in: nothing saved yet. Carry over this browser's old data if any, else start with examples.
    rev = null;
    lastSaved = "";
    var local = null;
    try { local = JSON.parse(localStorage.getItem(LEGACY_KEY) || "null"); } catch (e) {}
    return dataOnly(validState(local) ? local : seed());
  });
}

    var v = edit.vals[f.k];

    if (empty) return f.t === "days" ? "Pick at least one day" : f.l.replace(/ \(.*$/, "") + " can't be empty";

/* ============ aggregation ============ */
function eachDated(cb){
  state.academics.subjects.forEach(function (s){
    s.deadlines.forEach(function (d){ if (d.status !== "Done") cb({ date: d.date, time: d.time, title: s.name + " — " + d.title, area: "academics", toggle: function (){ d.status = "Done"; }, open: { k: "subject", id: s.id } }); });
    s.milestones.forEach(function (m){ if (!m.done) cb({ date: m.date, time: "", title: s.name + " — " + m.title, area: "academics", toggle: function (){ m.done = true; }, open: { k: "subject", id: s.id } }); });
  });
  state.lifeadmin.documents.forEach(function (d){ if (d.status !== "Complete" && d.deadline) cb({ date: d.deadline, time: "", title: d.name, area: "lifeadmin", toggle: function (){ d.status = "Complete"; }, open: { k: "lifeadmin", tab: "documents" } }); });
  state.lifeadmin.bills.forEach(function (b){ if (!b.paid) cb({ date: b.due, time: "", title: b.name + " — $" + b.amount, area: "lifeadmin", toggle: function (){ b.paid = true; }, open: { k: "lifeadmin", tab: "bills" } }); });
  state.lifeadmin.appointments.forEach(function (a){ if (!a.done && a.date) cb({ date: a.date, time: a.time, title: a.title, area: "lifeadmin", toggle: function (){ a.done = true; }, open: { k: "lifeadmin", tab: "appointments" } }); });
  state.career.applications.forEach(function (a){ if (appPending(a) && a.deadline) cb({ date: a.deadline, time: "", title: a.company + " — " + a.role, area: "career", toggle: null, open: { k: "career", tab: "applications" } }); });
  state.people.forEach(function (p){ if (p.next) cb({ date: p.next, time: "", title: "Follow up: " + p.name, area: "people", toggle: function (){ p.last = today(); p.next = ""; }, open: { k: "person", id: p.id } }); });
  ["recreation","social"].forEach(function (key){
    state.personal[key].forEach(function (t){ if (!t.done && t.date) cb({ date: t.date, time: t.time, title: t.text, area: "personal", toggle: function (){ t.done = true; }, open: { k: "personal" } }); });
  });
}
function undatedFill(area){
  if (area === "academics") return flatten(state.academics.subjects.map(function (s){
    return s.todos.filter(function (t){ return !t.done; }).map(function (t){ return { title: t.text, toggle: function (){ t.done = true; }, open: { k: "subject", id: s.id } }; });
  }));
  if (area === "lifeadmin") return state.lifeadmin.home.filter(function (t){ return !t.done; }).map(function (t){ return { title: t.text, toggle: function (){ t.done = true; }, open: { k: "lifeadmin", tab: "home" } }; });
  if (area === "career") return state.career.tasks.concat(state.career.networking).filter(function (t){ return !t.done; }).map(function (t){ return { title: t.text, toggle: function (){ t.done = true; }, open: { k: "career", tab: "tasks" } }; });
  if (area === "personal") return state.personal.tasks.filter(function (t){ return !t.done; }).map(function (t){ return { title: t.text, toggle: function (){ t.done = true; }, open: { k: "personal" } }; });
  return [];
}

/* ============ TODAY ============ */
function viewToday(pane){
  pane.appendChild(pageHead("Today", { sub: "Due today and overdue, across every area." }));
  var classesToday = classSessions(0, 0);
  if (classesToday.length) pane.appendChild(classBox("Classes today", [{ label: "", items: classesToday }]));
  var byArea = {};
  eachDated(function (e){
    if (dayDiff(e.date) <= 0){ (byArea[e.area] = byArea[e.area] || []).push(e); }
  });
  var order = ["academics","lifeadmin","career","people","personal"];
  var shown = 0;
  order.forEach(function (area){
    var items = (byArea[area] || []).sort(function (a, b){ return (a.date || "") < (b.date || "") ? -1 : 1; });
    if (items.length < 2 && area !== "people"){
      undatedFill(area).slice(0, 2 - items.length).forEach(function (f){ items.push(f); });
    }
    if (area === "lifeadmin"){
      var need = state.lifeadmin.groceries.filter(function (g){ return !g.done; }).length;
      if (need) items.push({ title: "Buy groceries · " + need + " to get", open: { k: "lifeadmin", tab: "groceries" } });
    }
    items = items.slice(0, 4);
    if (!items.length) return;
    shown += items.length;
    var wrap = el("div", { class: "today-area" });
    var head = el("div", { class: "today-area-head" },
      el("span", { class: "dot" }), el("span", { class: "lbl", text: AREAS[area].label }));
    head.style.setProperty("--area", AREAS[area].color);
    wrap.appendChild(head);
    var ul = el("ul", { class: "rows" });
    items.forEach(function (e){
      var meta = e.date ? metaDate(e.date, e.time) : null;
      if (e.toggle){
        ul.appendChild(checkRow({ text: e.title, meta: meta, onToggle: function (){ mutate(e.toggle); } }));
      } else {
        ul.appendChild(el("li", { class: "row link", onclick: function (){ if (e.open) go(e.open); } },
          el("span", { class: "bullet" }),
          el("span", { class: "row-main" }, el("span", { class: "row-text", text: e.title })),
          meta ? el("span", { class: "row-meta" }, meta) : null));
      }
    });
    wrap.appendChild(ul);
    pane.appendChild(wrap);
  });
  if (!shown) pane.appendChild(el("p", { class: "empty", text: classesToday.length
    ? "No deadlines or tasks due today."
    : "Nothing due today. Check Upcoming for what's next." }));
}

/* ============ UPCOMING ============ */
function viewUpcoming(pane){
  pane.appendChild(pageHead("Upcoming", { sub: "Everything with a date, in order." }));
  var coming = classSessions(0, 7), classDays = [];
  coming.forEach(function (x){
    var last = classDays[classDays.length - 1];
    if (last && last.date === x.date) last.items.push(x);
    else classDays.push({ date: x.date, label: dayHeading(x.date), items: [x] });
  });
  if (coming.length) pane.appendChild(classBox("Classes this week", classDays));
  var buckets = { overdue: [], today: [], tomorrow: [], week: [], later: [] };
  eachDated(function (e){
    var n = dayDiff(e.date);
    if (n < 0) buckets.overdue.push(e);
    else if (n === 0) buckets.today.push(e);
    else if (n === 1) buckets.tomorrow.push(e);
    else if (n <= 7) buckets.week.push(e);
    else buckets.later.push(e);
  });
  var labels = { overdue: "Overdue", today: "Today", tomorrow: "Tomorrow", week: "This Week", later: "Later" };
  ["overdue","today","tomorrow","week","later"].forEach(function (key){
    var items = buckets[key];
    if (!items.length) return;
    items.sort(function (a, b){ return (a.date + (a.time || "")) < (b.date + (b.time || "")) ? -1 : 1; });
    var b = el("div", { class: "bucket" }, el("h3", { class: "bucket-head", text: labels[key] }));
    var ul = el("ul", { class: "rows" });
    items.forEach(function (e){
      ul.appendChild(el("li", { class: "row link", onclick: function (){ if (e.open) go(e.open); } },
        el("span", { class: "bullet" }),
        el("span", { class: "row-main" }, el("span", { class: "row-text", text: e.title })),
        el("span", { class: "row-meta" },
          el("span", { class: "cat" }, el("span", { class: "cd", style: { background: AREAS[e.area].color } }), AREAS[e.area].label),
          metaDate(e.date, e.time, e.end))
      ));
    });
    b.appendChild(ul);
    pane.appendChild(b);
  });
  if (!coming.length && !["overdue","today","tomorrow","week","later"].some(function (k){ return buckets[k].length; }))
    pane.appendChild(el("p", { class: "empty", text: "Nothing scheduled. Add something with the + button." }));
}

      fRow("Organization", fInput("org")),
      fRow("Role", fInput("role"))));
    wrap.appendChild(fRow("How I know them", fInput("how", { placeholder: "e.g. Classmate, Recruiter, Mentor" })));
    wrap.appendChild(fRow("Next follow-up", fInput("next", { type: "date" })));
    wrap.appendChild(fRow("Notes", fArea("notes")));
  }
  else if (type === "personal"){
    wrap.appendChild(fRow("Type", fSelect("sub", [
      { v: "recreation", l: "Recreation" }, { v: "social", l: "Social" }, { v: "tasks", l: "Personal task" }
    ])));
    wrap.appendChild(fRow("What is it?", fInput("text", { placeholder: "e.g. Gym, Call home" })));
    if (v("sub", "recreation") !== "tasks"){
      wrap.appendChild(el("div", { class: "form-grid" },
        fRow("Date", fInput("date", { type: "date" })),
        fRow("Time", fInput("time", { type: "time" }))));
    }
  }
  return wrap;
}

function submitAdd(){
  var val = add.values, type = add.type, route;
  try {
    if (type === "academic"){
      var kind = val.kind || (state.academics.subjects.length ? "deadline" : "subject");
      if (kind === "class"){                       // the day/time picker lives in the edit dialog
        var cs = subjectById(val.subject || (state.academics.subjects[0] || {}).id); if (!cs) return;
        closeAdd();
        newClassTime(cs);
        return;
      }
      if (!val.title) return warn();
      if (kind === "subject"){
        var ns = { id: uid(), name: val.title, professor: val.professor || "",
          color: COLORS[state.academics.subjects.length % COLORS.length].v, deadlines: [], todos: [], milestones: [], schedule: [] };
        state.academics.subjects.push(ns);
        route = { k: "subject", id: ns.id };
      } else {
        var s = subjectById(val.subject || (state.academics.subjects[0] || {}).id); if (!s) return;
        if (kind === "deadline"){
          s.deadlines.push({ id: uid(), title: val.title, type: val.dtype || "Assignment",
            date: val.date || "", time: val.time || "", status: "Not started" });
        } else if (kind === "todo"){
          s.todos.push(mk(val.title));
        } else {
          s.milestones.push(ms(val.title, val.date || ""));
        }
        route = { k: "subject", id: s.id };
      }
    }
    else if (type === "lifeadmin"){
      var sub = val.sub || "document", la = state.lifeadmin;
      if (sub === "document"){ if (!val.name) return warn();
        la.documents.push({ id: uid(), name: val.name, deadline: val.date || "", status: val.status || "Not Started", link: val.link || "", notes: val.notes || "" });
        route = { k: "lifeadmin", tab: "documents" };
      } else if (sub === "home"){ if (!val.name) return warn();
        la.home.push(rec(val.name, val.recur || "none")); route = { k: "lifeadmin", tab: "home" };
      } else if (sub === "grocery"){ if (!val.name) return warn();
        la.groceries.push(gro(val.name, val.group || "Other")); route = { k: "lifeadmin", tab: "groceries" };
      } else if (sub === "bill"){ if (!val.name) return warn();
        la.bills.push(bill(val.name, Number(val.amount) || 0, val.date || today(), val.recur || "monthly"));
        route = { k: "lifeadmin", tab: "bills" };
      } else { if (!val.name) return warn();
        la.appointments.push(appt(val.name, val.date || offset(1), val.time || "")); route = { k: "lifeadmin", tab: "appointments" };
      }
    }
    else if (type === "career"){
      var cs = val.sub || "application", cr = state.career;
      if (cs === "application"){ if (!val.company) return warn();
        cr.applications.push(app(val.company, val.role || "", val.date || "", val.status || "Interested"));
        route = { k: "career", tab: "applications" };
      } else if (cs === "task"){ if (!val.text) return warn();
        cr.tasks.push(mk(val.text)); route = { k: "career", tab: "tasks" };
      } else { if (!val.text) return warn();
        cr.networking.push({ id: uid(), text: val.text, done: false, personId: val.personId || "" });
        route = { k: "career", tab: "networking" };
      }
    }
    else if (type === "person"){
      if (!val.name) return warn();
      var np = person(val.name, val.org || "", val.role || "", val.how || "", "", val.next || "", val.notes || "", []);
      state.people.push(np);
      route = { k: "person", id: np.id };
    }
    else if (type === "personal"){
      var pk = val.sub || "recreation";
      if (!val.text) return warn();
      state.personal[pk].push(pk === "tasks" ? mk(val.text) : dat(val.text, val.date || "", val.time || ""));
      route = { k: "personal" };
    }
  } catch (e) { return; }
  closeAdd();
  if (route) go(route); else render();
}
function warn(){
  var m = document.querySelector(".modal h2");
  if (m){ m.style.color = "var(--overdue)"; m.textContent = "Add a name or title first"; }
}

/* ============ sign-in ============ */
var appRoot = document.getElementById("appRoot");
var authRoot = document.getElementById("authRoot");

function showScreen(card){
  appRoot.hidden = true;
  closeAdd();
  authRoot.innerHTML = "";
  authRoot.appendChild(el("div", { class: "auth-wrap" }, card));
}
function brandBlock(sub){
  return [
    el("div", { class: "wordmark" }, "Marginalia", el("span", { class: "dot", text: "." })),
    el("p", { class: "auth-sub", text: sub })
  ];
}

function showLogin(msg){
  var email = el("input", { class: "inp", type: "email", autocomplete: "username", required: "required", "aria-label": "Email" });
  var pass = el("input", { class: "inp", type: "password", autocomplete: "current-password", required: "required", "aria-label": "Password" });
  var err = el("p", { class: "auth-err", role: "alert", text: msg || "" });
  var btn = el("button", { class: "btn-primary", type: "submit", text: "Sign in" });
  var form = el("form", { class: "auth-card", onsubmit: function (e){
    e.preventDefault();
    btn.disabled = true; btn.textContent = "Signing in…"; err.textContent = "";
    sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value }).then(function (res){
      if (res.error){
        var bad = res.error.status === 400 || /invalid/i.test(res.error.message || "");
        throw new Error(bad ? "That email or password isn't right." : (res.error.message || "Couldn't sign in. Try again."));
      }
      pass.value = "";
      enter(res.data.user);
    }).catch(function (ex){
      err.textContent = ex.message;
      btn.disabled = false; btn.textContent = "Sign in";
      pass.focus(); pass.select();
    });
  } },
    brandBlock("Sign in to continue."),
    el("div", { class: "form-row" }, el("label", { text: "Email" }), email),
    el("div", { class: "form-row" }, el("label", { text: "Password" }), pass),
    err, btn);
  showScreen(form);
  email.focus();
}

function showSetup(){
  showScreen(el("div", { class: "auth-card" },
    brandBlock("One-time setup needed."),
    el("p", { class: "auth-note" }, "Add your Supabase project URL and anon key to ", el("code", { text: "config.js" }),
      ", then redeploy. Steps are in the README.")));
}

function showFatal(message){
  showScreen(el("div", { class: "auth-card" },
    brandBlock("Couldn't open your data."),
    el("p", { class: "auth-err", role: "alert", text: message }),
    el("button", { class: "btn-primary", type: "button", text: "Try again", onclick: function (){
      if (userId) enter({ id: userId }); else boot();
    } }),
    el("button", { class: "btn-ghost", type: "button", style: { marginTop: "10px" }, text: "Sign out", onclick: signOut })));
}

function enter(user){
  userId = user.id;
  loadRemote().then(function (d){
    oneDatePerApplication(d);
    d.ui = { route: readRoute() };
    state = d;
    authRoot.innerHTML = "";
    appRoot.hidden = false;
    render();
    setSync("saved");
    startPolling();
  }).catch(function (ex){
    state = null;
    showFatal((ex && ex.message) || "Check your connection and try again.");
  });
}

function signOut(){
  flush().then(function (){ return sb.auth.signOut(); });
}

function leave(){
  clearTimeout(saveTimer);
  clearInterval(pullTimer);
  state = null; userId = null; lastSaved = ""; queued = ""; inflight = false; rev = null; hasRev = true;
  try { localStorage.removeItem(LEGACY_KEY); } catch (e) {}
  showLogin();
}

function boot(){
  var cfg = window.MARGINALIA_CONFIG || {};
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || /YOUR[-_]/i.test(cfg.supabaseUrl + cfg.supabaseAnonKey)) return showSetup();
  if (!window.supabase) return showFatal("The sign-in library didn't load. Check your connection and reload.");
  if (!sb){
    sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });
    // Keep this callback synchronous: calling Supabase from inside it can deadlock.
    sb.auth.onAuthStateChange(function (event){ if (event === "SIGNED_OUT") leave(); });
  }
  sb.auth.getSession().then(function (r){
    if (r.data && r.data.session) enter(r.data.session.user); else showLogin();
  }).catch(function (){ showLogin(); });
}

document.getElementById("signOut").addEventListener("click", signOut);

/* ============ go ============ */
boot();
</script>
