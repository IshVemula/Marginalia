<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marginalia</title>
<meta name="description" content="A calm personal operating system for graduate school and early adult life." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" />

<style>
  :root {
    --bg: #f7f4ed;
    --surface: #fffdf8;
    --sink: #f1ede3;
    --ink: #2a2620;
    --muted: #787063;
    --faint: #a39a8b;
    --line: #e7e0d2;
    --line-strong: #d5ccba;
    --accent: #6b5d45;
    --on-accent: #fbf8f1;
    --overdue: #a64c34;
    --done: #a89f8f;

    --c-acad: #43607f;
    --c-admin: #9c6a4c;
    --c-career: #4f7355;
    --c-people: #7c5875;
    --c-personal: #927b41;

    --font-sans: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-serif: 'IBM Plex Serif', ui-serif, Georgia, 'Times New Roman', serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17150f;
      --surface: #201d16;
      --sink: #1b1811;
      --ink: #ece5d6;
      --muted: #9a9080;
      --faint: #6f6656;
      --line: #2f2a20;
      --line-strong: #443d30;
      --accent: #c3b391;
      --on-accent: #1a1610;
      --overdue: #dd8a70;
      --done: #6d6553;

      --c-acad: #83a3c4;
      --c-admin: #cf9c7a;
      --c-career: #86ac8e;
      --c-people: #bd92b5;
      --c-personal: #ccb06c;
    }
  }

  :root[data-theme="dark"] {
    --bg: #17150f;
    --surface: #201d16;
    --sink: #1b1811;
    --ink: #ece5d6;
    --muted: #9a9080;
    --faint: #6f6656;
    --line: #2f2a20;
    --line-strong: #443d30;
    --accent: #c3b391;
    --on-accent: #1a1610;
    --overdue: #dd8a70;
    --done: #6d6553;
    --c-acad: #83a3c4;
    --c-admin: #cf9c7a;
    --c-career: #86ac8e;
    --c-people: #bd92b5;
    --c-personal: #ccb06c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .app { max-width: 1060px; margin: 0 auto; padding: 46px 26px 120px; }

  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 30px;
  }
  .wordmark { font-family: var(--font-serif); font-size: 24px; font-weight: 500; letter-spacing: 0.01em; }
  .wordmark .dot { color: var(--accent); }
  .today-date { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .shell { display: grid; grid-template-columns: 208px 1fr; gap: 54px; align-items: start; }

  /* ---------- sidebar ---------- */
  .eyebrow {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--faint);
  }

  .nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 28px; }
  .nav-gap { height: 16px; }
  .nav-label { padding: 0 10px 8px; }

  .nav-link {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 7px 10px; border: 0; background: transparent; color: var(--muted);
    font: inherit; text-align: left; cursor: pointer; border-radius: 6px;
    transition: color .14s ease, background .14s ease;
  }
  .nav-link:hover { color: var(--ink); background: var(--sink); }
  .nav-link[aria-current="page"] {
    color: var(--ink); font-weight: 500; background: var(--sink);
    box-shadow: inset 2px 0 0 var(--area, var(--accent));
  }
  .nav-link .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--area, var(--faint)); flex: none; }
  .nav-link.plain .dot { background: none; border: 1px solid var(--line-strong); }

  .add-open {
    margin-top: 18px; display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 14px; border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--surface); color: var(--ink); font: inherit; font-weight: 500; cursor: pointer;
    transition: border-color .14s ease;
  }
  .add-open:hover { border-color: var(--accent); }
  .add-open .plus { font-size: 15px; line-height: 1; color: var(--accent); }

  /* ---------- page head ---------- */
  .pane { min-width: 0; animation: fade .18s ease; }
  @keyframes fade { from { opacity: .35; } to { opacity: 1; } }

  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 18px; margin-bottom: 26px;
  }
  .crumb { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  .crumb button { border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; padding: 0; }
  .crumb button:hover { color: var(--ink); text-decoration: underline; }
  .page-title { font-family: var(--font-serif); font-size: 27px; font-weight: 500; margin: 0; text-wrap: balance; }
  .page-title .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; vertical-align: 0.06em; }
  .page-sub { color: var(--muted); font-size: 13.5px; margin-top: 3px; }

  /* ---------- sub nav ---------- */
  .subnav { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
  .subnav button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13.5px;
    padding: 8px 12px 10px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color .14s ease;
  }
  .subnav button:hover { color: var(--ink); }
  .subnav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--area, var(--accent)); font-weight: 500; }

  /* ---------- sections ---------- */
  .section { margin-bottom: 34px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .section-note { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }

  .rows { list-style: none; margin: 0; padding: 0; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 10px 4px;
    border-bottom: 1px solid var(--line); transition: background .12s ease;
  }
  .row:first-child { border-top: 1px solid var(--line); }
  .row.link { cursor: pointer; }
  .row.link:hover { background: var(--sink); }
  .row-main { flex: 1; min-width: 0; }
  .row-text { display: block; word-break: break-word; }
  .row-sub { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .row.done .row-text { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1px; }
  .row-meta { display: flex; align-items: center; gap: 10px; flex: none; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row-meta .overdue { color: var(--overdue); }
  .amount { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .check {
    width: 18px; height: 18px; border: 1.5px solid var(--line-strong); border-radius: 50%;
    display: grid; place-items: center; background: transparent; cursor: pointer; padding: 0; flex: none;
    transition: border-color .14s ease;
  }
  .check:hover { border-color: var(--muted); }
  .check svg { width: 11px; height: 11px; }
  .check path { stroke: transparent; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .row.done .check { border-color: var(--muted); }
  .row.done .check path { stroke: var(--muted); transition: stroke .18s ease; }
  .bullet { width: 18px; height: 18px; border: 1.5px solid var(--line-strong); border-radius: 50%; flex: none; }

  .del {
    border: 0; background: transparent; color: var(--faint); font-size: 17px; line-height: 1;
    padding: 2px 5px; cursor: pointer; border-radius: 5px; opacity: 0; flex: none; transition: opacity .12s ease, color .12s ease;
  }
  .row:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { color: var(--overdue); }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px;
    border: 1px solid var(--line); border-radius: 4px; font-size: 11px; font-weight: 500;
    color: var(--muted); background: transparent; cursor: pointer; white-space: nowrap;
  }
  .pill .pd { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .pill.good { color: var(--c-career); }
  .pill.work { color: var(--c-personal); }
  .pill.bad { color: var(--overdue); }
  .pill.idle { color: var(--faint); }
  .pill[disabled] { cursor: default; }

  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
  .tag .td { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .type-eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }

  .recur { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); }

  .empty { color: var(--faint); font-style: italic; padding: 16px 4px; margin: 0; font-size: 13.5px; }

  .inline-add { display: flex; align-items: center; gap: 8px; padding: 9px 4px 9px 0; border-bottom: 1px dashed var(--line); }
  .inline-add .plus { color: var(--faint); font-size: 15px; flex: none; width: 18px; text-align: center; }
  .inline-add input { flex: 1; border: 0; background: transparent; color: inherit; font: inherit; padding: 2px 0; }
  .inline-add input:focus { outline: none; }

  .link-out { font-family: var(--font-mono); font-size: 11px; color: var(--accent); text-decoration: none; }
  .link-out:hover { text-decoration: underline; }

  .milestone { display: flex; align-items: center; gap: 12px; padding: 11px 12px; margin-bottom: 6px; background: var(--sink); border-left: 2px solid var(--area, var(--accent)); border-radius: 0 5px 5px 0; }
  .milestone .m-title { flex: 1; font-weight: 500; }
  .milestone.done .m-title { color: var(--done); text-decoration: line-through; }

  /* ---------- people profile ---------- */
  .defn { display: grid; grid-template-columns: 130px 1fr; gap: 4px 16px; margin: 4px 0 8px; }
  .defn dt { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); padding-top: 9px; }
  .defn dd { margin: 0; }
  .field-input {
    width: 100%; border: 0; border-bottom: 1px solid transparent; background: transparent; color: var(--ink);
    font: inherit; padding: 6px 0; transition: border-color .14s ease;
  }
  .field-input:hover { border-bottom-color: var(--line); }
  .field-input:focus { outline: none; border-bottom-color: var(--accent); }
  textarea.field-input { resize: vertical; min-height: 44px; line-height: 1.5; }

  /* ---------- today ---------- */
  .today-area { margin-bottom: 26px; }
  .today-area-head { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .today-area-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--area); flex: none; }
  .today-area-head .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); }

  /* ---------- upcoming ---------- */
  .bucket { margin-bottom: 30px; }
  .bucket-head { font-family: var(--font-serif); font-size: 17px; font-weight: 500; margin: 0 0 8px; }
  .bucket .row-meta .cat { display: inline-flex; align-items: center; gap: 5px; }
  .bucket .row-meta .cat .cd { width: 6px; height: 6px; border-radius: 50%; }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 42%, transparent);
    display: grid; place-items: start center; padding: 8vh 20px 40px; z-index: 40; overflow-y: auto;
    animation: fade .16s ease;
  }
  .modal {
    width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 10px; padding: 24px 24px 20px; box-shadow: 0 20px 50px -24px color-mix(in srgb, var(--ink) 50%, transparent);
  }
  .modal h2 { font-family: var(--font-serif); font-size: 19px; font-weight: 500; margin: 0 0 16px; }
  .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .type-btn {
    display: flex; align-items: center; gap: 9px; padding: 13px 12px; border: 1px solid var(--line-strong);
    border-radius: 8px; background: transparent; color: var(--ink); font: inherit; cursor: pointer; text-align: left;
    transition: border-color .14s ease, background .14s ease;
  }
  .type-btn:hover { border-color: var(--accent); background: var(--sink); }
  .type-btn .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .type-btn.wide { grid-column: 1 / -1; }

  .form-row { margin-bottom: 13px; }
  .form-row label { display: block; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); margin-bottom: 5px; }
  .inp {
    width: 100%; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--bg); color: var(--ink);
    font: inherit; font-size: 14px; padding: 9px 10px;
  }
  .inp:focus { outline: none; border-color: var(--accent); }
  textarea.inp { resize: vertical; min-height: 54px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .btn-ghost { border: 0; background: transparent; color: var(--muted); font: inherit; cursor: pointer; padding: 8px 4px; }
  .btn-ghost:hover { color: var(--ink); }
  .btn-primary {
    border: 0; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600;
    padding: 9px 20px; border-radius: 7px; cursor: pointer;
  }
  .btn-primary:hover { filter: brightness(1.07); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, .pane, .overlay { animation: none !important; }
    .row.done .check path, .check, .field-input { transition: none; }
  }

  @media (max-width: 780px) {
    .app { padding: 30px 18px 90px; }
    .shell { grid-template-columns: 1fr; gap: 24px; }
    .nav { position: static; flex-direction: row; flex-wrap: wrap; gap: 6px; }
    .nav-label, .nav-gap { display: none; }
    .nav-link { width: auto; }
    .add-open { margin-top: 4px; }
    .defn { grid-template-columns: 1fr; gap: 0; }
    .defn dt { padding-top: 12px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="brand">
    <div class="wordmark">Marginalia<span class="dot">.</span></div>
    <div class="today-date" id="todayDate"></div>
  </header>
  <div class="shell">
    <nav class="nav" id="nav" aria-label="Areas"></nav>
    <main class="pane" id="pane" aria-live="polite"></main>
  </div>
</div>
<div id="modalRoot"></div>

<script>
"use strict";

/* ============ helpers ============ */
var uid = function () {
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
};

function flatten(a){ return a.reduce(function(o,x){ return o.concat(Array.isArray(x)?flatten(x):x); }, []); }
function el(tag, props){
  var n = document.createElement(tag);
  var kids = Array.prototype.slice.call(arguments, 2);
  if (props) for (var k in props){
    var v = props[k];
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "value") n.value = v;
    else if (k === "checked") n.checked = !!v;
    else if (k === "style" && typeof v === "object") Object.assign(n.style, v);
    else if (k.indexOf("on") === 0 && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v);
  }
  flatten(kids).forEach(function (kid){
    if (kid == null || kid === false) return;
    n.appendChild(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
  });
  return n;
}

var CHECK = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7.5 L5.6 11 L12 3.5"/></svg>';

/* ---- dates ---- */
function toISO(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function today(){ var d = new Date(); d.setHours(0,0,0,0); return toISO(d); }
function offset(days){ var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+days); return toISO(d); }
function dayDiff(iso){
  if (!iso) return Infinity;
  return Math.round((new Date(iso+"T00:00:00") - new Date(today()+"T00:00:00")) / 86400000);
}
var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var WDL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function fmtDate(iso){
  if (!iso) return "";
  var n = dayDiff(iso);
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  if (n === -1) return "Yesterday";
  if (n < -1) return (-n) + "d ago";
  var d = new Date(iso+"T00:00:00");
  if (n > 1 && n < 7) return WD[d.getDay()];
  var s = MON[d.getMonth()] + " " + d.getDate();
  if (d.getFullYear() !== new Date().getFullYear()) s += ", " + d.getFullYear();
  return s;
}
function fmtTime(t){
  if (!t) return "";
  var p = t.split(":"), h = +p[0], ap = h < 12 ? "AM" : "PM", hh = h % 12; if (hh === 0) hh = 12;
  return hh + ":" + p[1] + " " + ap;
}
function fmtWhen(d, t){ return [fmtDate(d), fmtTime(t)].filter(Boolean).join(" · "); }
function isOpenOverdue(iso){ return iso && dayDiff(iso) < 0; }

/* ============ constants ============ */
var AREAS = {
  today:     { label: "Today" },
  upcoming:  { label: "Upcoming" },
  academics: { label: "Academics", color: "var(--c-acad)" },
  lifeadmin: { label: "Life Admin", color: "var(--c-admin)" },
  career:    { label: "Career",    color: "var(--c-career)" },
  people:    { label: "People",    color: "var(--c-people)" },
  personal:  { label: "Personal",  color: "var(--c-personal)" }
};
var DEADLINE_TYPES = ["Assignment","Exam","Project","Presentation","Reading","Quiz"];
var DEADLINE_STATUS = ["Not started","In progress","Done"];
var DOC_STATUS = ["Not Started","In Progress","Submitted","Waiting","Complete"];
var APP_STATUS = ["Interested","Preparing","Applied","Interview","Offer","Rejected","Closed"];
var RECUR = ["none","daily","weekly","monthly"];
var GROCERY_GROUPS = ["Produce","Dairy","Pantry","Household","Other"];

function pillTone(s){
  s = (s || "").toLowerCase();
  if (["done","complete","submitted","paid","offer"].indexOf(s) > -1) return "good";
  if (["in progress","preparing","applied","interview","waiting"].indexOf(s) > -1) return "work";
  if (["rejected","closed","overdue"].indexOf(s) > -1) return "bad";
  return "idle";
}

/* ============ seed ============ */
function seed(){
  return {
    ui: { route: { k: "today" } },
    academics: {
      semester: "Fall 2026",
      subjects: [
        { id: "s-econ", name: "Economics & Finance", professor: "Dr. Lindqvist", color: "var(--c-acad)",
          deadlines: [
            { id: uid(), title: "Assignment 3", type: "Assignment", date: offset(9), time: "23:59", status: "Not started" },
            { id: uid(), title: "Midterm", type: "Exam", date: offset(21), time: "14:00", status: "Not started" },
            { id: uid(), title: "Problem Set 4", type: "Assignment", date: offset(30), time: "23:59", status: "Not started" }
          ],
          todos: [ mk("Read Chapter 4"), mk("Finish question 3"), mk("Review lecture slides") ],
          milestones: [ ms("Midterm", offset(21)), ms("Final Exam", offset(103)) ] },
        { id: "s-ai", name: "AI Applications", professor: "Prof. Adeyemi", color: "var(--c-career)",
          deadlines: [
            { id: uid(), title: "Case Analysis 2", type: "Assignment", date: offset(6), time: "23:59", status: "In progress" },
            { id: uid(), title: "Quiz 1", type: "Quiz", date: offset(12), time: "09:00", status: "Not started" },
            { id: uid(), title: "Group Project Proposal", type: "Project", date: offset(15), time: "17:00", status: "Not started" }
          ],
          todos: [ mk("Read AI case"), mk("Message project team"), mk("Set up Colab notebook") ],
          milestones: [ ms("Final Project", offset(96)) ] },
        { id: "s-ind", name: "Independent Study", professor: "Dr. Puga", color: "var(--c-people)",
          deadlines: [
            { id: uid(), title: "Literature review draft", type: "Reading", date: offset(27), time: "23:59", status: "Not started" }
          ],
          todos: [ mk("Email professor about scope"), mk("Send grant requirements") ],
          milestones: [ ms("Final Paper", offset(100)) ] },
        { id: "s-tech", name: "Technology Strategy", professor: "Prof. Rhee", color: "var(--c-personal)",
          deadlines: [
            { id: uid(), title: "Reading response 2", type: "Reading", date: offset(5), time: "23:59", status: "Not started" },

/* ============ state ============ */
var KEY = "marginalia.v2";
var state;
function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return seed();
    var p = JSON.parse(raw);
    if (!p || !p.academics || !p.people) return seed();
    if (!p.ui) p.ui = { route: { k: "today" } };
    return p;
  } catch (e) { return seed(); }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function mutate(fn){ fn(); save(); render(); }
function go(route){ state.ui.route = route; save(); render(); window.scrollTo(0, 0); }

function subjectById(id){
  return state.academics.subjects.filter(function (s){ return s.id === id; })[0];
}
function personById(id){
  return state.people.filter(function (p){ return p.id === id; })[0];
}

/* ============ small components ============ */
function checkRow(opts){
  var li = el("li", { class: "row" + (opts.done ? " done" : "") },
    el("button", { class: "check", role: "checkbox", "aria-checked": String(!!opts.done),
      "aria-label": opts.done ? "Mark not done" : "Mark done", onclick: opts.onToggle },
      el("span", { html: CHECK })),
    el("span", { class: "row-main" },
      el("span", { class: "row-text", text: opts.text }),
      opts.sub ? el("span", { class: "row-sub", text: opts.sub }) : null),
    opts.meta ? el("span", { class: "row-meta" }, opts.meta) : null,
    opts.onDelete ? el("button", { class: "del", "aria-label": "Delete", text: "×", onclick: opts.onDelete }) : null
  );
  return li;
}
function inlineAdd(key, placeholder, onAdd){
  var input = el("input", { type: "text", placeholder: placeholder, "data-ia": key,
    onkeydown: function (e){
      if (e.key === "Enter" && input.value.trim()){
        var v = input.value.trim(); input.value = "";
        mutate(function (){ onAdd(v); });
        var again = document.querySelector('[data-ia="' + key + '"]');
        if (again) again.focus();
      }
    } });
  return el("div", { class: "inline-add" }, el("span", { class: "plus", text: "+" }), input);
}
function statusPill(cur, list, onChange){
  return el("button", { class: "pill " + pillTone(cur), title: "Click to change status",
    onclick: function (){ onChange(list[(list.indexOf(cur) + 1) % list.length]); } },
    el("span", { class: "pd" }), cur);
}
function metaDate(iso, time){
  var span = el("span", { text: fmtWhen(iso, time) });
  if (isOpenOverdue(iso)) span.className = "overdue";
  return span;
}
function catTag(areaKey){
  var a = AREAS[areaKey];
  return el("span", { class: "tag" }, el("span", { class: "td", style: { background: a.color } }), a.label);

function pageHead(title, opts){
  opts = opts || {};
  var head = el("div", { class: "page-head" });
  var left = el("div");
  if (opts.crumb){
    var c = el("div", { class: "crumb" });
    opts.crumb.forEach(function (part, i){
      if (i) c.appendChild(document.createTextNode("  ›  "));
      c.appendChild(part.go ? el("button", { onclick: function (){ go(part.go); }, text: part.label })
                            : document.createTextNode(part.label));
    });
    left.appendChild(c);
  }
  var h1 = el("h1", { class: "page-title" });
  if (opts.swatch) h1.appendChild(el("span", { class: "swatch", style: { background: opts.swatch } }));
  h1.appendChild(document.createTextNode(title));
  left.appendChild(h1);
  if (opts.sub) left.appendChild(el("div", { class: "page-sub", text: opts.sub }));
  head.appendChild(left);
  return head;
}
function subnav(area, tabs, current, onPick){
  var bar = el("div", { class: "subnav" });
  if (AREAS[area] && AREAS[area].color) bar.style.setProperty("--area", AREAS[area].color);
  tabs.forEach(function (t){
    var b = el("button", { text: t.label, onclick: function (){ onPick(t.key); } });
    if (t.key === current) b.setAttribute("aria-current", "page");
    bar.appendChild(b);
  });
  return bar;
}
function section(title, note, body){
  var s = el("div", { class: "section" });
  var head = el("div", { class: "section-head" }, el("div", { class: "eyebrow", text: title }));
  if (note) head.appendChild(el("div", { class: "section-note", text: note }));
  s.appendChild(head);
  flatten([body]).forEach(function (b){ if (b) s.appendChild(b); });
  return s;
}
function rowsList(items){
  if (!items.length) return el("p", { class: "empty", text: "Nothing here yet." });
  var ul = el("ul", { class: "rows" });
  items.forEach(function (i){ ul.appendChild(i); });
  return ul;
}

  var openTodos = s.todos.filter(function (t){ return !t.done; }).length;
  var openDl = s.deadlines.filter(function (d){ return d.status !== "Done"; });
  var next = openDl.slice().sort(function (a, b){ return (a.date || "9") < (b.date || "9") ? -1 : 1; })[0];
  return { open: openTodos + openDl.length, next: next };

function clearBtn(n, fn, label){
  return el("button", { class: "btn-ghost", style: { marginTop: "12px", fontSize: "13px" },
    text: (label || "Clear") + " " + n + (label ? "" : " done"),
    onclick: function (){ mutate(fn); } });
}
function rollDate(iso, recur){
  var d = new Date((iso || today()) + "T00:00:00");
  if (recur === "daily") d.setDate(d.getDate() + 1);
  else if (recur === "weekly") d.setDate(d.getDate() + 7);
  else d.setMonth(d.getMonth() + 1);
  return toISO(d);
}

/* ============ aggregation ============ */
function eachDated(cb){
  state.academics.subjects.forEach(function (s){
    s.deadlines.forEach(function (d){ if (d.status !== "Done") cb({ date: d.date, time: d.time, title: s.name + " — " + d.title, area: "academics", toggle: function (){ d.status = "Done"; }, open: { k: "subject", id: s.id } }); });
    s.milestones.forEach(function (m){ if (!m.done) cb({ date: m.date, time: "", title: s.name + " — " + m.title, area: "academics", toggle: function (){ m.done = true; }, open: { k: "subject", id: s.id } }); });
  });
  state.lifeadmin.documents.forEach(function (d){ if (d.status !== "Complete" && d.deadline) cb({ date: d.deadline, time: "", title: d.name, area: "lifeadmin", toggle: function (){ d.status = "Complete"; }, open: { k: "lifeadmin", tab: "documents" } }); });
  state.lifeadmin.bills.forEach(function (b){ if (!b.paid) cb({ date: b.due, time: "", title: b.name + " — $" + b.amount, area: "lifeadmin", toggle: function (){ b.paid = true; }, open: { k: "lifeadmin", tab: "bills" } }); });
  state.lifeadmin.appointments.forEach(function (a){ if (!a.done && a.date) cb({ date: a.date, time: a.time, title: a.title, area: "lifeadmin", toggle: function (){ a.done = true; }, open: { k: "lifeadmin", tab: "appointments" } }); });
  state.career.applications.forEach(function (a){ if (["Rejected","Closed","Offer"].indexOf(a.status) < 0 && a.deadline) cb({ date: a.deadline, time: "", title: a.company + " — " + a.role, area: "career", toggle: null, open: { k: "career", tab: "applications" } }); });
  state.people.forEach(function (p){ if (p.next) cb({ date: p.next, time: "", title: "Follow up: " + p.name, area: "people", toggle: function (){ p.last = today(); p.next = ""; }, open: { k: "person", id: p.id } }); });
  ["recreation","social"].forEach(function (key){
    state.personal[key].forEach(function (t){ if (!t.done && t.date) cb({ date: t.date, time: t.time, title: t.text, area: "personal", toggle: function (){ t.done = true; }, open: { k: "personal" } }); });
  });
}
function undatedFill(area){
  if (area === "academics") return flatten(state.academics.subjects.map(function (s){
    return s.todos.filter(function (t){ return !t.done; }).map(function (t){ return { title: t.text, toggle: function (){ t.done = true; }, open: { k: "subject", id: s.id } }; });
  }));
  if (area === "lifeadmin") return state.lifeadmin.home.filter(function (t){ return !t.done; }).map(function (t){ return { title: t.text, toggle: function (){ t.done = true; }, open: { k: "lifeadmin", tab: "home" } }; });
  if (area === "career") return state.career.tasks.concat(state.career.networking).filter(function (t){ return !t.done; }).map(function (t){ return { title: t.text, toggle: function (){ t.done = true; }, open: { k: "career", tab: "tasks" } }; });
  if (area === "personal") return state.personal.tasks.filter(function (t){ return !t.done; }).map(function (t){ return { title: t.text, toggle: function (){ t.done = true; }, open: { k: "personal" } }; });
  return [];
}

/* ============ TODAY ============ */
function viewToday(pane){
  pane.appendChild(pageHead("Today", { sub: "Due today and overdue, across every area." }));
  var byArea = {};
  eachDated(function (e){
    if (dayDiff(e.date) <= 0){ (byArea[e.area] = byArea[e.area] || []).push(e); }
  });
  var order = ["academics","lifeadmin","career","people","personal"];
  var shown = 0;
  order.forEach(function (area){
    var items = (byArea[area] || []).sort(function (a, b){ return (a.date || "") < (b.date || "") ? -1 : 1; });
    if (items.length < 2 && area !== "people"){
      undatedFill(area).slice(0, 2 - items.length).forEach(function (f){ items.push(f); });
    }
    if (area === "lifeadmin"){
      var need = state.lifeadmin.groceries.filter(function (g){ return !g.done; }).length;
      if (need) items.push({ title: "Buy groceries · " + need + " to get", open: { k: "lifeadmin", tab: "groceries" } });
    }
    items = items.slice(0, 4);
    if (!items.length) return;
    shown += items.length;
    var wrap = el("div", { class: "today-area" });
    var head = el("div", { class: "today-area-head" },
      el("span", { class: "dot" }), el("span", { class: "lbl", text: AREAS[area].label }));
    head.style.setProperty("--area", AREAS[area].color);
    wrap.appendChild(head);
    var ul = el("ul", { class: "rows" });
    items.forEach(function (e){
      var meta = e.date ? metaDate(e.date, e.time) : null;
      if (e.toggle){
        ul.appendChild(checkRow({ text: e.title, meta: meta, onToggle: function (){ mutate(e.toggle); } }));
      } else {
        ul.appendChild(el("li", { class: "row link", onclick: function (){ if (e.open) go(e.open); } },
          el("span", { class: "bullet" }),
          el("span", { class: "row-main" }, el("span", { class: "row-text", text: e.title })),
          meta ? el("span", { class: "row-meta" }, meta) : null));
      }
    });
    wrap.appendChild(ul);
    pane.appendChild(wrap);
  });
  if (!shown) pane.appendChild(el("p", { class: "empty", text: "Nothing due today. Check Upcoming for what's next." }));
}

/* ============ UPCOMING ============ */
function viewUpcoming(pane){
  pane.appendChild(pageHead("Upcoming", { sub: "Everything with a date, in order." }));
  var buckets = { overdue: [], today: [], tomorrow: [], week: [], later: [] };
  eachDated(function (e){
    var n = dayDiff(e.date);
    if (n < 0) buckets.overdue.push(e);
    else if (n === 0) buckets.today.push(e);
    else if (n === 1) buckets.tomorrow.push(e);
    else if (n <= 7) buckets.week.push(e);
    else buckets.later.push(e);
  });
  var labels = { overdue: "Overdue", today: "Today", tomorrow: "Tomorrow", week: "This Week", later: "Later" };
  ["overdue","today","tomorrow","week","later"].forEach(function (key){
    var items = buckets[key];
    if (!items.length) return;
    items.sort(function (a, b){ return (a.date + (a.time || "")) < (b.date + (b.time || "")) ? -1 : 1; });
    var b = el("div", { class: "bucket" }, el("h3", { class: "bucket-head", text: labels[key] }));
    var ul = el("ul", { class: "rows" });
    items.forEach(function (e){
      ul.appendChild(el("li", { class: "row link", onclick: function (){ if (e.open) go(e.open); } },
        el("span", { class: "bullet" }),
        el("span", { class: "row-main" }, el("span", { class: "row-text", text: e.title })),
        el("span", { class: "row-meta" },
          el("span", { class: "cat" }, el("span", { class: "cd", style: { background: AREAS[e.area].color } }), AREAS[e.area].label),
          metaDate(e.date, e.time))
      ));
    });
    b.appendChild(ul);
    pane.appendChild(b);
  });
  if (!["overdue","today","tomorrow","week","later"].some(function (k){ return buckets[k].length; }))
    pane.appendChild(el("p", { class: "empty", text: "Nothing scheduled. Add something with the + button." }));
}

  try {
    if (type === "academic"){
      var s = subjectById(val.subject); if (!s) return;
      var kind = val.kind || "deadline";
      if (kind === "deadline"){
        if (!val.title) return warn();
        s.deadlines.push({ id: uid(), title: val.title, type: val.dtype || "Assignment",
          date: val.date || "", time: val.time || "", status: "Not started" });
      } else if (kind === "todo"){
        if (!val.title) return warn();
        s.todos.push(mk(val.title));
      } else {
        if (!val.title) return warn();
        s.milestones.push(ms(val.title, val.date || ""));
      }
      route = { k: "subject", id: s.id };
    }
    else if (type === "lifeadmin"){
      var sub = val.sub || "document", la = state.lifeadmin;
      if (sub === "document"){ if (!val.name) return warn();
        la.documents.push({ id: uid(), name: val.name, deadline: val.date || "", status: val.status || "Not Started", link: val.link || "", notes: val.notes || "" });
        route = { k: "lifeadmin", tab: "documents" };
      } else if (sub === "home"){ if (!val.name) return warn();
        la.home.push(rec(val.name, val.recur || "none")); route = { k: "lifeadmin", tab: "home" };
      } else if (sub === "grocery"){ if (!val.name) return warn();
        la.groceries.push(gro(val.name, val.group || "Other")); route = { k: "lifeadmin", tab: "groceries" };
      } else if (sub === "bill"){ if (!val.name) return warn();
        la.bills.push(bill(val.name, Number(val.amount) || 0, val.date || today(), val.recur || "monthly"));
        route = { k: "lifeadmin", tab: "bills" };
      } else { if (!val.name) return warn();
        la.appointments.push(appt(val.name, val.date || offset(1), val.time || "")); route = { k: "lifeadmin", tab: "appointments" };
      }
    }
    else if (type === "career"){
      var cs = val.sub || "application", cr = state.career;
      if (cs === "application"){ if (!val.company) return warn();
        cr.applications.push(app(val.company, val.role || "", val.date || "", val.status || "Interested", ""));
        route = { k: "career", tab: "applications" };
      } else if (cs === "task"){ if (!val.text) return warn();
        cr.tasks.push(mk(val.text)); route = { k: "career", tab: "tasks" };
      } else { if (!val.text) return warn();
        cr.networking.push({ id: uid(), text: val.text, done: false, personId: val.personId || "" });
        route = { k: "career", tab: "networking" };
      }
    }
    else if (type === "person"){
      if (!val.name) return warn();
      var np = person(val.name, val.org || "", val.role || "", val.how || "", "", val.next || "", val.notes || "", []);
      state.people.push(np);
      route = { k: "person", id: np.id };
    }
    else if (type === "personal"){
      var pk = val.sub || "recreation";
      if (!val.text) return warn();
      state.personal[pk].push(pk === "tasks" ? mk(val.text) : dat(val.text, val.date || "", val.time || ""));
      route = { k: "personal" };
    }
  } catch (e) { return; }
  closeAdd();
  if (route) go(route); else render();
}
function warn(){
  var m = document.querySelector(".modal h2");
  if (m){ m.style.color = "var(--overdue)"; m.textContent = "Add a name or title first"; }
}

/* ============ go ============ */
state = load();
render();
</script>
